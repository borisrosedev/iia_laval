services:
  postgres:
    image: postgres:16-alpine
    container_name: tp-archi-postgres
    environment:
      POSTGRES_DB: architecture3tiers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d architecture3tiers"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-1:
    build:
      context: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/architecture3tiers?schema=public
      JWT_SECRET: super-secret-token
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  backend-2:
    build:
      context: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/architecture3tiers?schema=public
      JWT_SECRET: super-secret-token
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: nginx:1.27-alpine
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
    ports:
      - "3000:80"

volumes:
  postgres_data:
